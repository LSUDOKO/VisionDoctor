[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "visiondoctor"
version = "1.0.0"
description = "Agentic camera-health system: OpenCV 5 diagnosis, label-free AI-impact prediction, verified self-repair."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=2.3,<3",
  "boto3>=1.35",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
# Never install on COOL hosts: it would shadow /opt/cool's cv2 (docs/05 §1).
opencv = ["opencv-python-headless==5.0.0.93"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
visiondoctor = "visiondoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visiondoctor = ["sim/scenarios/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: needs models/data", "bedrock: needs AWS credentials"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "B008"]  # B008: FastAPI Depends() defaults are idiomatic

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
